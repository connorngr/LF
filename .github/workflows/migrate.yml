name: Database migrations

# Applies pending Prisma migrations to the production database after a merge.
# `prisma migrate deploy` only runs migrations missing from _prisma_migrations,
# so runs with nothing pending are no-ops.
on:
  push:
    branches: [main]
    paths:
      - prisma/migrations/**
      - prisma/schema.prisma
      - .github/workflows/migrate.yml
  workflow_dispatch:

# Never run two migrations against the same database at once.
concurrency:
  group: prisma-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Use Neon's direct (non-pooled) connection string for migrations.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for the production environment."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show migration status
        # Exits non-zero while migrations are pending; this step is informational.
        run: pnpm exec prisma migrate status || true

      - name: Apply pending migrations
        run: pnpm exec prisma migrate deploy
